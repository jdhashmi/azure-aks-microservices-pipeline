# to secrets.yaml (git-ignored), fill in base64 values, then kubectl apply it.
apiVersion: v1
kind: Secret
metadata:
  name: ecomm-secrets-w08e1
type: Opaque
data:
  POSTGRES_USER: "<base64>"
  POSTGRES_PASSWORD: "<base64>"
  AZURE_STORAGE_ACCOUNT_NAME: "<base64>"
  AZURE_STORAGE_ACCOUNT_KEY: "<base64>"
